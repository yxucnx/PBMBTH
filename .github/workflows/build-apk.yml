name: Build Android APK

on:
  push:
    branches: [main, master]
    tags: ["v*"]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Accept Android SDK Licenses
        run: |
          mkdir -p "$ANDROID_HOME/licenses" || true
          echo "24333f8a6381dd452d31162ab532437998515e44" > "$ANDROID_HOME/licenses/android-sdk-license"
          echo "84831b9409646a918e30573bab4c9c91346d8abd" >> "$ANDROID_HOME/licenses/android-sdk-license"
          echo "d56f5187479451eabf01fb78af6dfcb131a6481e" >> "$ANDROID_HOME/licenses/android-sdk-license"
          echo "bb9f447449f9b654fa8224562fc61876281f39e0" > "$ANDROID_HOME/licenses/android-sdk-preview-license"
          yes | sdkmanager --licenses 2>/dev/null || true

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.14.3'

      - name: Prepare Signing Keystore
        id: keystore
        run: |
          if [ -d "android-twa" ]; then
            PROJECT_DIR="android-twa"
          else
            PROJECT_DIR="."
          fi
          echo "project_dir=$PROJECT_DIR" >> $GITHUB_OUTPUT

          mkdir -p "$PROJECT_DIR/keystore"
          if [ -n "${{ secrets.RELEASE_KEYSTORE_BASE64 }}" ]; then
            echo "Using official signing key from GitHub Secret..."
            echo "${{ secrets.RELEASE_KEYSTORE_BASE64 }}" | base64 -d > "$PROJECT_DIR/keystore/release.jks"
            echo "storeFile=release.jks" > "$PROJECT_DIR/keystore/keystore.properties"
            echo "storePassword=${{ secrets.RELEASE_KEYSTORE_PASSWORD }}" >> "$PROJECT_DIR/keystore/keystore.properties"
            echo "keyAlias=${{ secrets.RELEASE_KEY_ALIAS }}" >> "$PROJECT_DIR/keystore/keystore.properties"
            echo "keyPassword=${{ secrets.RELEASE_KEY_PASSWORD }}" >> "$PROJECT_DIR/keystore/keystore.properties"
          else
            echo "Generating standalone release key for testing..."
            keytool -genkeypair -v \
              -keystore "$PROJECT_DIR/keystore/release.jks" \
              -alias shootingpoint \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -storepass shootingpoint \
              -keypass shootingpoint \
              -dname "CN=ShootingPoint, OU=Game, O=ShootingPoint, L=Bangkok, ST=Bangkok, C=TH"
            echo "storeFile=release.jks" > "$PROJECT_DIR/keystore/keystore.properties"
            echo "storePassword=shootingpoint" >> "$PROJECT_DIR/keystore/keystore.properties"
            echo "keyAlias=shootingpoint" >> "$PROJECT_DIR/keystore/keystore.properties"
            echo "keyPassword=shootingpoint" >> "$PROJECT_DIR/keystore/keystore.properties"
          fi

      - name: Build Release APK
        env:
          PBMB_KEYSTORE_PROPERTIES: ${{ github.workspace }}/${{ steps.keystore.outputs.project_dir }}/keystore/keystore.properties
        run: |
          cd "${{ steps.keystore.outputs.project_dir }}"
          gradle assembleRelease --no-daemon

      - name: Prepare APK Artifacts
        run: |
          PROJECT_DIR="${{ steps.keystore.outputs.project_dir }}"
          APK_PATH=$(find "$PROJECT_DIR/app/build/outputs/apk/release" -name "*.apk" | head -n 1)
          if [ -z "$APK_PATH" ]; then
            echo "Error: APK file not found!"
            exit 1
          fi
          echo "Found APK at: $APK_PATH"
          cp "$APK_PATH" ShootingPoint-2.2.2.apk
          sha256sum ShootingPoint-2.2.2.apk > ShootingPoint-2.2.2.apk.sha256
          cat ShootingPoint-2.2.2.apk.sha256

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ShootingPoint-2.2.2-APK
          path: |
            ShootingPoint-2.2.2.apk
            ShootingPoint-2.2.2.apk.sha256

      - name: Attach to GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" ShootingPoint-2.2.2.apk ShootingPoint-2.2.2.apk.sha256 \
            --title "Shooting Point Android $GITHUB_REF_NAME" \
            --notes "Release APK for Shooting Point Android (v2.2.2). Download and install directly on Android device."
