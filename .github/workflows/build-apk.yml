name: Build Android APK

# Builds the Android APK (Shooting Point) using GitHub's runners without installing Android Studio or SDK locally.
#   - push to main / manual run (workflow_dispatch): the APK is uploaded as an artifact of the run
#   - push a tag (git tag v2.2.2 && git push origin v2.2.2): the APK is also attached to a GitHub Release
on:
  push:
    branches: [main, master]
    tags: ["v*"]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  apk:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android Platform 36 & Build Tools
        run: |
          yes | sdkmanager --licenses || true
          sdkmanager "platforms;android-36" "build-tools;36.0.0" || true

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Prepare Signing Keystore
        id: keystore
        run: |
          if [ -d "android-twa" ]; then
            PROJECT_DIR="android-twa"
          else
            PROJECT_DIR="."
          fi
          echo "project_dir=$PROJECT_DIR" >> $GITHUB_OUTPUT

          mkdir -p "$PROJECT_DIR/keystore"
          if [ -n "${{ secrets.RELEASE_KEYSTORE_BASE64 }}" ]; then
            echo "Using official signing key from GitHub Secret..."
            echo "${{ secrets.RELEASE_KEYSTORE_BASE64 }}" | base64 -d > "$PROJECT_DIR/keystore/release.jks"
            cat <<EOF > "$PROJECT_DIR/keystore/keystore.properties"
storeFile=release.jks
storePassword=${{ secrets.RELEASE_KEYSTORE_PASSWORD }}
keyAlias=${{ secrets.RELEASE_KEY_ALIAS }}
keyPassword=${{ secrets.RELEASE_KEY_PASSWORD }}
EOF
          else
            echo "No signing secret found. Generating standalone release key for testing..."
            keytool -genkeypair -v \
              -keystore "$PROJECT_DIR/keystore/release.jks" \
              -alias shootingpoint \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -storepass shootingpoint \
              -keypass shootingpoint \
              -dname "CN=ShootingPoint, OU=Game, O=ShootingPoint, L=Bangkok, ST=Bangkok, C=TH"
            cat <<EOF > "$PROJECT_DIR/keystore/keystore.properties"
storeFile=release.jks
storePassword=shootingpoint
keyAlias=shootingpoint
keyPassword=shootingpoint
EOF
          fi

      - name: Build Release APK
        env:
          PBMB_KEYSTORE_PROPERTIES: ${{ github.workspace }}/${{ steps.keystore.outputs.project_dir }}/keystore/keystore.properties
        run: |
          cd "${{ steps.keystore.outputs.project_dir }}"
          gradle assembleRelease --no-daemon

      - name: Prepare APK Artifacts
        run: |
          PROJECT_DIR="${{ steps.keystore.outputs.project_dir }}"
          APK_PATH=$(find "$PROJECT_DIR/app/build/outputs/apk/release" -name "*.apk" | head -n 1)
          if [ -z "$APK_PATH" ]; then
            echo "Error: APK file not found!"
            exit 1
          fi
          echo "Found APK at: $APK_PATH"
          cp "$APK_PATH" "ShootingPoint-2.2.2.apk"
          sha256sum "ShootingPoint-2.2.2.apk" > "ShootingPoint-2.2.2.apk.sha256"
          cat "ShootingPoint-2.2.2.apk.sha256"

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ShootingPoint-2.2.2-APK
          path: |
            ShootingPoint-2.2.2.apk
            ShootingPoint-2.2.2.apk.sha256

      - name: Attach to GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" ShootingPoint-2.2.2.apk ShootingPoint-2.2.2.apk.sha256 \
            --title "Shooting Point Android $GITHUB_REF_NAME" \
            --notes "Release APK for Shooting Point Android (v2.2.2). Download and install directly on Android device."
